# Configuration file

formation {
    # Altitude offset relative to leader Y (blocks). Positive = above, negative = below. [range: -500.0 ~ 500.0, default: 0.0]
    S:formationAltOffset=0.0

    # Distance behind the leader (blocks). [range: 1.0 ~ 500.0, default: 30.0]
    S:formationRearDist=30.0

    # Lateral distance from the leader centre-line (blocks). [range: 1.0 ~ 500.0, default: 20.0]
    S:formationSideDist=20.0

    # Maximum absolute Y altitude for attack runs regardless of weapon type. 0 = no ceiling. [range: 0.0 ~ 10000.0, default: 0.0]
    S:maxAttackAltitude=0.0

    # Maximum wingmen per aircraft. [range: 1 ~ 64, default: 10]
    I:maxWingmen=10

    # Minimum absolute Y altitude for attack runs regardless of weapon type. 0 = no floor. [range: 0.0 ~ 10000.0, default: 0.0]
    S:minAttackAltitude=0.0
}


tvmissile {
    # While a player is steering a TV/TA missile, stream the terrain and entities around the missile to that player (the same camera-feed mechanism UAVs use) so the missile camera shows real ground and targets instead of void, even far from the launcher. [default: true]
    B:chunkLoad=true

    # Maximum distance (blocks) a TV missile may travel from its operator before self-destructing. -1 = unlimited. [range: -1 ~ 2147483647, default: 500]
    I:maxRange=500
}


uav {
    # UAV controller effective range in blocks. -1 for unlimited. [range: -1 ~ 2147483647, default: 99999]
    I:controllerRange=99999

    # Force-keep chunks loaded around EVERY aircraft (including dormant, idle vehicles), so they keep simulating far from any player. Off (default): dormant aircraft let their chunks unload normally. UAVs are discovered/loaded on demand regardless of this setting — when a player connects to one or requests its FBO camera feed. Warning: ON can greatly increase server load (one forced 5x5 chunk area per aircraft). [default: false]
    B:forceChunkload=false

    # UAV maximum flight distance in blocks. -1 for unlimited. [range: -1 ~ 2147483647, default: 99999]
    I:maxDistance=99999
}


