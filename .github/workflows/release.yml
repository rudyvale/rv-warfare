name: Publish release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag matching src/release.json, for example v1.1.0
        required: true
        type: string
      base_tag:
        description: Published release containing the verified payload and runtime
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      BASE_TAG: ${{ inputs.base_tag }}
      VM_SKIP_UPDATE_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install world build dependencies
        run: python -m pip install -r requirements-world.txt
      - name: Validate version and protect published releases
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$' -or $env:BASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid tag' }
          $version = (Get-Content src/release.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag and source version differ' }
          $existing = gh release view $env:RELEASE_TAG --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; use a new version' }
          $global:LASTEXITCODE = 0
      - name: Check source
        shell: powershell
        run: |
          & ./qa/test_updates.ps1
          & ./qa/test_connection.ps1
          & ./qa/test_gui.ps1
          python -X utf8 qa/test_connection_launch.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 qa/test_release_contract.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 qa/test_world_package.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 qa/test_host.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 qa/test_host_races.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 qa/test_porthole_host.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 qa/test_host_close.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 host/warfare-launcher.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build clean world, menus and player book
        shell: pwsh
        run: |
          python -X utf8 tools/build_world_template.py
          if ($LASTEXITCODE) { throw 'World generation failed' }
          python -X utf8 qa/test_world_template.py --full
          if ($LASTEXITCODE) { throw 'World validation failed' }
          python -X utf8 tools/build_player_guide.py
          if ($LASTEXITCODE) { throw 'Book generation failed' }
          python -X utf8 tools/build_server_gameplay.py --output .local/server-gameplay --book .local/player-guide/warfare
          if ($LASTEXITCODE) { throw 'Menu generation failed' }
          python -X utf8 qa/test_player_guide.py --functions .local/server-gameplay/warfare
          if ($LASTEXITCODE) { throw 'Book validation failed' }
          python -X utf8 tools/stage_world_template.py --template .local/world-template/Battlefield-Extended --functions .local/server-gameplay/warfare --output .local/release-world
          if ($LASTEXITCODE) { throw 'World integration failed' }
          python -X utf8 tools/package_world_template.py --stage .local/release-world --output .local/RV-World-Template.zip
          if ($LASTEXITCODE) { throw 'World packaging failed' }
      - name: Get verified base and build
        shell: pwsh
        run: |
          gh release download $env:BASE_TAG --pattern RV-Setup.zip --dir base
          if ($LASTEXITCODE) { throw 'Base download failed' }
          Expand-Archive base/RV-Setup.zip -DestinationPath base/extracted
          python tools/build_release.py --base base/extracted/RV-Setup --output dist --world-template .local/RV-World-Template.zip
          if ($LASTEXITCODE) { throw 'Build failed' }
          python tools/verify_release.py --directory dist --tag $env:RELEASE_TAG
          if ($LASTEXITCODE) { throw 'Artifact verification failed' }
      - name: Stage complete release
        shell: pwsh
        run: |
          $assets = @('dist/RV-Setup.zip', 'dist/RV-Host-Tools.zip', 'dist/SHA256SUMS.txt')
          if (Test-Path dist/RV-World-Template.zip) { $assets += 'dist/RV-World-Template.zip' }
          gh release create $env:RELEASE_TAG @assets --verify-tag --draft --title "RV Warfare $env:RELEASE_TAG" --notes-file CHANGELOG.md
          if ($LASTEXITCODE) { throw 'Draft release failed' }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($release.assets.Count -ne $assets.Count) { throw 'Incomplete release' }
          foreach ($line in (Get-Content dist/SHA256SUMS.txt)) {
            $parts = $line -split '  ', 2
            $asset = @($release.assets | Where-Object name -eq $parts[1])
            if ($asset.Count -ne 1 -or $asset[0].digest -ne "sha256:$($parts[0])" -or $asset[0].state -ne 'uploaded') { throw 'Uploaded asset checksum mismatch' }
          }
      - name: Publish and verify public state
        shell: pwsh
        run: |
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE) { throw 'Publish failed' }
          python tools/verify_release.py --directory dist --tag $env:RELEASE_TAG --remote
          if ($LASTEXITCODE) { throw 'Public release verification failed' }
