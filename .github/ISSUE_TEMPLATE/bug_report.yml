name: Bug report
description: Report an installation, launch or update problem
body:
  - type: input
    id: version
    attributes:
      label: RV and Windows versions
      placeholder: RV 1.0.0, Windows 11
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened?
      description: Include steps to reproduce, the expected result and the actual behaviour.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error message
      description: Include the relevant log excerpt after removing tokens, private addresses and account data.
      render: text
