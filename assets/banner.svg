  <text x="76" y="84" fill="#a9f4db" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" letter-spacing="3.5">MINECRAFT 1.12.2  ·  WINDOWS + MAC PREVIEW</text>
  <text x="70" y="213" fill="#f4f7fa" font-family="Segoe UI,Arial,sans-serif" font-size="91" font-weight="750" letter-spacing="-4">RV Warfare</text>
  <text x="78" y="267" fill="#c0ccda" font-family="Segoe UI,Arial,sans-serif" font-size="24">Aircraft. Combat. Your world.</text>
