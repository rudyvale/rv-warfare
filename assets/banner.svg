  <circle cx="1025" cy="211" r="150" fill="none" stroke="#8ce3cf" stroke-opacity=".13" stroke-width="1.5"/>
  <circle cx="1025" cy="211" r="111" fill="none" stroke="#8ce3cf" stroke-opacity=".19" stroke-width="1.5" stroke-dasharray="5 10"/>
  <g fill="none" stroke="url(#accent)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1025 210L930 154M1025 210L1120 154M1025 210L930 266M1025 210L1120 266" stroke-width="9"/>
    <path d="M997 194h56v32h-56z" fill="#192f3c" stroke-width="5"/>
    <path d="M930 154l-38-4m38 4 10-34m-10 34-29 24m219-24 38-4m-38 4-10-34m10 34 29 24M930 266l-38 4m38-4 10 34m-10-34-29-24m219 24 38 4m-38-4-10 34m10-34 29-24" stroke-width="4"/>
    <circle cx="892" cy="150" r="20" stroke-width="4"/>
    <circle cx="1158" cy="150" r="20" stroke-width="4"/>
    <circle cx="892" cy="270" r="20" stroke-width="4"/>
    <circle cx="1158" cy="270" r="20" stroke-width="4"/>
    <path d="M1015 202h20v16h-20z" fill="#f28d72" stroke="none"/>
