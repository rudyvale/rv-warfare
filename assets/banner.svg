    </pattern>
    <filter id="glow" x="-.5" y="-.5" width="2" height="2">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="1280" height="420" rx="26" fill="url(#background)"/>
  <rect width="1280" height="420" rx="26" fill="url(#grid)"/>
  <path d="M745 0h535v420H704c91-91 75-151 139-221S823 78 745 0" fill="url(#terrain)"/>
