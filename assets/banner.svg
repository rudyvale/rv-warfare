<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title description">
  <title id="title">RV Warfare</title>
  <desc id="description">A Minecraft 1.12.2 battlefield modpack for Windows and an experimental Intel Mac Preview.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101827"/>
      <stop offset="1" stop-color="#192f3c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a9f4db"/>
      <stop offset="1" stop-color="#58c5b3"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#a9f4db" stroke-opacity=".055"/>
    </pattern>
    <pattern id="terrain" width="180" height="180" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
